name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  server:
    name: Server (build & test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore DartsStatsApplication.Server.Tests/DartsStatsApplication.Server.Tests.csproj

      - name: Build
        run: dotnet build DartsStatsApplication.Server.Tests/DartsStatsApplication.Server.Tests.csproj --no-restore --no-incremental

      - name: Test
        run: dotnet test DartsStatsApplication.Server.Tests/DartsStatsApplication.Server.Tests.csproj --no-build --verbosity normal

  client:
    name: Client (build, lint & test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dartsstatsapplication.client
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: dartsstatsapplication.client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Unit test
        run: npm run test:unit

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: e2e/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Boots the isolated docker-compose.e2e.yml stack, runs the suite
      # against it, and tears it down again - see support/global-setup.ts and
      # support/global-teardown.ts. Same command a developer runs locally.
      - name: Run E2E suite
        run: npm test

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 14

  # Builds both deployable images on every push/PR (catches a broken
  # Dockerfile before merge), but only pushes to GHCR on an actual merge to
  # master - a PR build never publishes anything. Waits on the three jobs
  # above so a broken build/lint/test/e2e run never reaches the registry.
  build-and-push:
    name: Build & push images
    runs-on: ubuntu-latest
    needs: [server, client, e2e]
    permissions:
      contents: read
      packages: write
    env:
      # `secrets` isn't a valid context inside a step-level `if:` - routing
      # through `env` here is what lets the deploy-hook steps below check
      # "is this secret actually set yet" further down.
      RENDER_DEPLOY_HOOK_SERVER: ${{ secrets.RENDER_DEPLOY_HOOK_SERVER }}
      RENDER_DEPLOY_HOOK_CLIENT: ${{ secrets.RENDER_DEPLOY_HOOK_CLIENT }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push server image
        uses: docker/build-push-action@v6
        with:
          context: ./DartsStatsApplication.Server
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/danboy151/dartsstatsapplication-server:latest
            ghcr.io/danboy151/dartsstatsapplication-server:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # VITE_API_BASE_URL/VITE_API_KEY are baked into the client bundle at
      # build time (see dartsstatsapplication.client/Dockerfile) - VITE_API_KEY
      # resolves to an empty secret (i.e. the key stays off) until
      # ApiSecurity:ApiKey is actually turned on server-side and a matching
      # VITE_API_KEY repo secret is added; no workflow change needed then.
      #
      # VITE_API_BASE_URL is TEMPORARILY the Render-assigned URL rather than
      # https://renegadedartsapi.dhorridge.au, since dhorridge.au is still
      # pending registration at GoDaddy. Switch this back once DNS is live -
      # no other change needed, Cors:AllowedOrigins on the server already
      # allows both origins so the cutover is just this one line.
      - name: Build & push client image
        uses: docker/build-push-action@v6
        with:
          context: ./dartsstatsapplication.client
          push: ${{ github.event_name == 'push' }}
          build-args: |
            VITE_API_BASE_URL=https://dartsstatsapplication-server-latest.onrender.com
            VITE_API_KEY=${{ secrets.VITE_API_KEY }}
          tags: |
            ghcr.io/danboy151/dartsstatsapplication-client:latest
            ghcr.io/danboy151/dartsstatsapplication-client:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Render deploys these images by pulling from GHCR rather than building
      # from this repo itself, so it won't notice a new :latest tag on its
      # own - these hooks are what actually trigger a redeploy. Each secret
      # is genuinely optional: until the corresponding Render service exists
      # and its Deploy Hook URL is added as a repo secret, these steps just
      # skip rather than failing the build.
      - name: Trigger Render deploy (server)
        if: github.event_name == 'push' && env.RENDER_DEPLOY_HOOK_SERVER != ''
        run: curl -fsS -X POST "$RENDER_DEPLOY_HOOK_SERVER"

      - name: Trigger Render deploy (client)
        if: github.event_name == 'push' && env.RENDER_DEPLOY_HOOK_CLIENT != ''
        run: curl -fsS -X POST "$RENDER_DEPLOY_HOOK_CLIENT"
