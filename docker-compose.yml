    services:
      client:
        build:
          context: ./DartsStatsApplication.Client/
          dockerfile: Dockerfile
        ports:
            - "80:80"
        depends_on:
            - server
        volumes:
            - .:/app/
      server:
        build:
          context: ./DartsStatsApplication.Server/
          dockerfile: Dockerfile
        ports:
          - "5001:8080"
        depends_on:
          - postgresdb
        environment:
          # Your connection string, using the service name 'postgresdb' as the host
          - ConnectionStrings__Database=Host=postgresdb;Port=5432;Database=dartsStats;Username=postgres;Password=postgres
          - ASPNETCORE_ENVIRONMENT=Development
          - ASPNETCORE_HTTP_PORTS=8080
          # Uncomment to require an API key once this is reachable from outside your machine:
          # - ApiSecurity__ApiKey=change-me
      postgresdb:
        image: postgres:latest
        environment:
          POSTGRES_DB: dartsStats
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        volumes:
          - postgres_data:/var/lib/postgresql
        ports:
          - "54320:5432" # Optional: Expose port for external tools
    volumes:
      postgres_data:
        driver: local
      